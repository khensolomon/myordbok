[package]
name = "myordbok"
version = "0.0.0" # the app's version comes from tauri.conf.json, set at build time
description = "MyOrdbok, the English–Myanmar dictionary"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# staticlib and cdylib for iOS and Android, rlib for the desktop binary.
name = "myordbok_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-http = "2.9.0"
tauri-plugin-opener = "2.7.3"
tauri-plugin-haptics = "2.4.2"
tauri-plugin-deep-link = "2.6.3"
# The plugins' settings of tauri.conf.json (plugins.deep-link) are written
# into the app as JSON by tauri::generate_context!, which names this crate.
serde_json = "1"
# Kept in this repository with one change: plugins/tauri-plugin-iap/README.md.
tauri-plugin-iap = { path = "plugins/tauri-plugin-iap" }
tauri-plugin-web-sheet = { path = "plugins/tauri-plugin-web-sheet" }

# iOS: turning on the web view's own back and forward swipe (src/lib.rs).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
