# The MyOrdbok app (Tauri), built on request: Actions → App → Run workflow.
# GitHub lists a workflow to run by hand only once it is on the default
# branch (master), so this one appears after a release.
#
#   build   test-apk (default): an APK to install on a phone for testing,
#           signed with a key made for this run only; it cannot update an
#           install from Play.
#           play-aab: the bundle for Play, signed with the upload key
#           (secrets ANDROID_UPLOAD_KEYSTORE, _PASSWORD, _ALIAS; docs/deploy.md,
#           The app), then put on Play's closed testing track (Alpha) through the
#           Play Developer API (secret GOOGLE_PLAY_ACCOUNT, a service account's
#           JSON key; scripts/play-upload.js). Always asks the live server.
#           ios-testflight: the iOS app, signed through the App Store Connect
#           API key (secrets APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8)
#           and uploaded to App Store Connect, where it reaches TestFlight.
#   server  beta (default) or live: the API a test APK or a TestFlight build asks
#
# Each run's version code (Android) and build number (iOS) is 1000 plus the
# build number (scripts/app-config.js): the stores refuse one they have had
# before, so a build is uploaded once, and the next comes from a later
# version (make release).

name: App

on:
  workflow_dispatch:
    inputs:
      build:
        description: What to build
        type: choice
        options: [test-apk, play-aab, ios-testflight]
        default: test-apk
      server:
        description: The API a test APK or TestFlight build asks (a Play bundle always asks live)
        type: choice
        options: [beta, live]
        default: beta

permissions:
  contents: read

env:
  # r28 and later link for 16 KB memory pages by default (Play requires it
  # of every 64-bit native library since 1 November 2025).
  NDK_VERSION: 28.2.13676358
  SERVER: ${{ inputs.build == 'play-aab' && 'live' || inputs.server }}

jobs:
  android:
    name: Android (${{ inputs.build }})
    if: inputs.build != 'ios-testflight'
    runs-on: ubuntu-latest
    steps:
      - name: The upload key, for a Play bundle
        if: inputs.build == 'play-aab'
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_UPLOAD_ALIAS }}
        run: |
          for name in KEYSTORE PASSWORD ALIAS; do
            test -n "${!name}" || { echo "::error::Secret ANDROID_UPLOAD_$name is missing (docs/deploy.md, The app)"; exit 1; }
          done
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$PASSWORD" -alias "$ALIAS" > /dev/null \
            || { echo "::error::The keystore does not open with ANDROID_UPLOAD_PASSWORD, or has no key ANDROID_UPLOAD_ALIAS"; exit 1; }

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Build the app's files
        run: node scripts/build.js --target tauri --api "https://${{ env.SERVER == 'live' && 'myordbok.com' || 'beta.myordbok.com' }}"
      - name: Version
        run: |
          node scripts/app-config.js > src-tauri/tauri.ci.json
          cat src-tauri/tauri.ci.json
          echo "VERSION=$(node -p "require('./package.json').version.replace('+', '-')")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # The Tauri CLI is a devDependency run as the npm script "tauri": the
      # Android project it makes calls back into it through that script.
      - name: The Android project, then its icons and splash
        run: |
          npm run tauri -- android init --ci
          npm run tauri -- icon src-tauri/app-icon.png
          node scripts/splash.js install android --apply

      # Play's floor: target Android 16 (API 36) from 31 August 2026. The
      # level comes from the Tauri CLI's template; a lower one stops here.
      - name: Target API level
        run: |
          level=$(grep -Eo 'targetSdk *= *[0-9]+' src-tauri/gen/android/app/build.gradle.kts | grep -Eo '[0-9]+$')
          echo "targetSdk $level"
          test -n "$level" && [ "$level" -ge 36 ] || { echo "::error::targetSdk is ${level:-missing}; Google Play requires 36 or higher"; exit 1; }

      # A test APK: phones (arm). A Play bundle: every ABI Play serves, phones,
      # Chromebooks and emulators; Play gives each device its own part.
      # The 64-bit libraries are linked for 16 KB pages whatever the NDK's
      # default; the step after checks it.
      - name: Build
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
        run: |
          if [ "${{ inputs.build }}" = play-aab ]; then
            npm run tauri -- android build --aab --target aarch64 armv7 x86_64 i686 --config src-tauri/tauri.ci.json
          else
            npm run tauri -- android build --apk --target aarch64 armv7 --config src-tauri/tauri.ci.json
          fi

      - name: 16 KB memory pages
        run: |
          libs=$(find src-tauri/gen/android/app/src/main/jniLibs -path '*64*' -name '*.so')
          test -n "$libs" || { echo "::error::No 64-bit native library was found to check"; exit 1; }
          bad=0
          for so in $libs; do
            align=$(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }' | sort -u | tr '\n' ' ')
            echo "$so: $align"
            for a in $align; do [ $((a)) -ge 16384 ] || bad=1; done
          done
          [ $bad = 0 ] || { echo "::error::A 64-bit native library is not aligned for 16 KB pages"; exit 1; }

      - name: Sign for testing
        if: inputs.build == 'test-apk'
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -n 1)
          test -n "$apk" || { echo "::error::No unsigned APK was built"; exit 1; }
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          keytool -genkeypair -keystore test.jks -alias test -keyalg RSA -keysize 2048 -validity 30 \
            -storepass testpass -keypass testpass -dname "CN=MyOrdbok test" > /dev/null
          "$tools/zipalign" -f -P 16 4 "$apk" aligned.apk
          "$tools/apksigner" sign --ks test.jks --ks-pass pass:testpass --key-pass pass:testpass \
            --out "myordbok-$SERVER-$VERSION-test.apk" aligned.apk

      # A bundle is signed with jarsigner (apksigner is for APKs); Play then
      # signs what it delivers with the app signing key it keeps.
      - name: Sign for Play
        if: inputs.build == 'play-aab'
        env:
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_UPLOAD_ALIAS }}
        run: |
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*release*.aab' | head -n 1)
          test -n "$aab" || { echo "::error::No release bundle was built"; exit 1; }
          out="myordbok-play-$VERSION.aab"
          cp "$aab" "$out"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 "$out" "$ALIAS" > /dev/null
          jarsigner -verify "$out" > /dev/null || { echo "::error::The signed bundle does not verify"; exit 1; }
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v5
        with:
          name: myordbok-android-${{ inputs.build }}-${{ env.SERVER }}
          path: |
            myordbok-*-test.apk
            myordbok-play-*.aab
          if-no-files-found: error

      # On Play's closed testing track (Alpha): the testers' Play Store offers
      # it as an update once Play has reviewed it; a release still in review
      # there is replaced by this one. The bundle is kept as an artifact
      # first, so a refused upload leaves it to upload by hand.
      - name: To Play, closed testing
        if: inputs.build == 'play-aab'
        env:
          GOOGLE_PLAY_ACCOUNT: ${{ secrets.GOOGLE_PLAY_ACCOUNT }}
        run: node scripts/play-upload.js "myordbok-play-$VERSION.aab" --track alpha --notes "MyOrdbok $VERSION" --apply

  ios:
    name: iOS (TestFlight)
    if: inputs.build == 'ios-testflight'
    # Apple takes only builds made with the current SDK (iOS 27 from April
    # 2027); this image carries Xcode 27 (github.blog changelog 2026-10-16).
    runs-on: xcode-27
    steps:
      - name: The iOS SDK is 27 or later
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $sdk"
          test "${sdk%%.*}" -ge 27 || { echo "::error::iOS SDK $sdk: App Store Connect takes only builds made with the iOS 27 SDK or later"; exit 1; }

      # Xcode signs through this key: it makes the distribution certificate and
      # profile itself, so none is kept in the repository.
      - name: The App Store Connect API key
        env:
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY_ID: ${{ secrets.APPLE_API_KEY }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in ISSUER KEY_ID P8; do
            test -n "${!name}" || { echo "::error::A secret is missing: APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_KEY_P8 are needed (docs/deploy.md, The app)"; exit 1; }
          done
          grep -q 'BEGIN PRIVATE KEY' <<< "$P8" || { echo "::error::APPLE_API_KEY_P8 is not the .p8 file's text"; exit 1; }
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          printf '%s\n' "$P8" > "$dir/AuthKey_$KEY_ID.p8"
          {
            echo "APPLE_API_ISSUER=$ISSUER"
            echo "APPLE_API_KEY=$KEY_ID"
            echo "APPLE_API_KEY_PATH=$dir/AuthKey_$KEY_ID.p8"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the app's files
        run: node scripts/build.js --target tauri --api "https://${{ env.SERVER == 'live' && 'myordbok.com' || 'beta.myordbok.com' }}"
      - name: Version
        run: |
          node scripts/app-config.js > src-tauri/tauri.ci.json
          cat src-tauri/tauri.ci.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      # Keyed by the Xcode in use: build scripts keep the toolchain's paths,
      # and a cache made with another Xcode links against one not installed.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: xcode-27

      - name: The Xcode project, then its icons and splash
        run: |
          npm run tauri -- ios init --ci
          npm run tauri -- icon src-tauri/app-icon.png
          node scripts/splash.js install ios --apply
      - name: Build
        run: npm run tauri -- ios build --export-method app-store-connect --config src-tauri/tauri.ci.json
      # A plugin's Swift code is linked as a static library: when its entry
      # point is reported missing, this shows which libraries were built and
      # whether each holds one.
      - name: The plugins' Swift libraries (after a failed build)
        if: failure()
        run: |
          find src-tauri/target/aarch64-apple-ios/release/build -path '*swift-rs*' -name 'lib*.a' | while read -r lib; do
            echo "$lib"
            nm -gU "$lib" 2>/dev/null | grep -i 'init_plugin' || echo "  (no init_plugin symbol)"
          done

      - name: Upload to App Store Connect
        run: |
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)
          test -n "$ipa" || { echo "::error::No .ipa was built"; exit 1; }
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - name: Remove the key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect"
