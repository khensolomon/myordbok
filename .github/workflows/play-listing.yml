# The Play store listing from store/play/ (scripts/play-listing.js): texts
# and graphics per language. Run from the Actions tab: without "apply", the
# log shows Play's listing as it is and what would change; with it, the
# changes are sent and Play reviews them. "part" sends one part only (the
# rest stays as Play has it); "language" one language's folder.
name: Play listing

on:
  workflow_dispatch:
    inputs:
      part:
        description: What to send
        type: choice
        options: [all, texts, screenshots, icon, feature]
        default: all
      language:
        description: Which language's folder (all, or a code such as en-US)
        default: all
      apply:
        description: Send the changes to Play (without it, only show them)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The listing
        env:
          GOOGLE_PLAY_ACCOUNT: ${{ secrets.GOOGLE_PLAY_ACCOUNT }}
          PART: ${{ inputs.part }}
          LANGUAGE: ${{ inputs.language }}
        run: node scripts/play-listing.js --only "$PART" --language "$LANGUAGE" ${{ inputs.apply && '--apply' || '' }}
