name: Build and Deploy

on:
  push:
    branches: [ master ]

jobs:
  build:
    if: startsWith(github.event.head_commit.message, 'deploy:')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install & Build Frontend
        run: |
          npm install
          npm run build 

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Django App
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/django-app:latest

      - name: Build and Push Nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: ghcr.io/${{ github.repository }}/nginx-prod:latest

  check_local_vm_runner:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      is_online: ${{ steps.runner_status.outputs.is_online }}
    steps:
      - name: Check Self-Hosted Runner Status
        id: runner_status
        run: |
          echo "Checking runner status via GitHub API..."
          # Note: We must use a Personal Access Token (PAT) here. 
          # The default GITHUB_TOKEN does not have the required permissions to list runners.
          RESPONSE=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.VM_RUNNER_STATUS_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners")
          
          # Use jq to check if there is at least one runner with status == "online"
          IS_ONLINE=$(echo "$RESPONSE" | jq -r 'if .runners then (any(.runners[]; .status == "online")) else "false" end')
          
          echo "Local runner online status: $IS_ONLINE"
          echo "is_online=$IS_ONLINE" >> "$GITHUB_OUTPUT"

  deploy_local:
    needs: [build, check_local_vm_runner]
    if: needs.check_local_vm_runner.outputs.is_online == 'true'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to GHCR on VM
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Recreate .env file from Secret
        run: |
          printf "%s" "${{ secrets.ENV_FILE_CONTENT }}" > .env
          chmod 600 .env

      - name: Initialize/Update Stack
        run: |
          set -a
          [ -f .env ] && . .env
          set +a
          export GITHUB_REPOSITORY=${{ github.repository }}
          # mkdir -p "$DB_DIR" "$STORAGE_DIR" "$MEDIA_DIR"
          
          docker compose -f docker.production.yml pull
          # --detach=false ensures the command waits for the update to finish/fail
          docker stack deploy -c docker.production.yml --with-registry-auth --detach=false myordbok

      - name: Dump Service Logs on Failure
        if: failure()
        run: |
          echo "Deployment failed! Fetching recent logs for debugging..."
          echo "--- WEB LOGS ---"
          docker service logs myordbok_web --tail 100 || true
          echo "--- NGINX LOGS ---"
          docker service logs myordbok_nginx --tail 100 || true
          echo "--- DB LOGS ---"
          docker service logs myordbok_db --tail 100 || true

      - name: Wait for MySQL readiness
        run: |
          NETWORK_NAME="myordbok_default"
          set -a
          [ -f .env ] && . .env
          set +a
          for i in {1..20}; do
            if docker run --rm --network $NETWORK_NAME mysql:8.0 mysqladmin ping -h db -u root --password="$MYSQL_ROOT_PASSWORD" > /dev/null 2>&1; then
              echo "MySQL is ready!"
              break
            fi
            sleep 5
          done

      - name: Run Database Migrations
        run: |
          NETWORK_NAME="myordbok_default"
          IMAGE_NAME="ghcr.io/${{ github.repository }}/django-app:latest"
          set -a
          [ -f .env ] && . .env
          set +a
          docker run --rm --network $NETWORK_NAME --env-file .env $IMAGE_NAME python manage.py migrate --noinput

      - name: Verify Data Import
        run: |
          set -a
          [ -f .env ] && . .env
          set +a
          DB_CONTAINER=$(docker ps -q -f name=myordbok_db)
          echo "--- DATA VERIFICATION ---"
          docker exec -i $DB_CONTAINER mysql -u root -p"$MYSQL_ROOT_PASSWORD" "$DB_NAME" -e "SELECT COUNT(*) as album_count FROM album;" || echo "Table 'album' not found."

      - name: Verify Healthy Deployment
        run: |
          echo "Monitoring deployment health..."
          # Since we use --detach=false, we just check final state
          RUNNING=$(docker service ls --filter name=myordbok_web --format "{{.Replicas}}")
          echo "Final Replicas: $RUNNING"
          if [[ "$RUNNING" == "2/2" ]]; then
            echo "Deployment successful!"
            exit 0
          else
            echo "Deployment failed health checks. Showing logs..."
            docker service logs myordbok_web --tail 50
            exit 1
          fi