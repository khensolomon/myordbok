# Cloudflare Worker: serves the built app (dist/web) and the /api routes.
#
# Environments (each deploys as its own Worker with its own domain):
#   (top level)   local development only: `wrangler dev --local`
#   beta          beta.myordbok.com — deployed from the dev branch
#   production    myordbok.com      — deployed from master, switched on at cutover
#
# Bindings and routes are not inherited by environments, so each one
# declares its own. Both sites use the same three D1 databases:
#
#   APP         myordbok-app         what the app writes: members, sign-in,
#                                    reactions, comments, studio edits, and which
#                                    dictionary database each site reads
#                                    (assets/db/migrations). Migrations must stay
#                                    backward compatible: beta can run newer code
#                                    against the data production reads.
#   DATASET     myordbok-dataset     every new dictionary build lands here first;
#                                    beta reads it, so beta previews the next release
#   DICTIONARY  myordbok-dictionary  the dictionary production readers get
#
# Builds come from the private dataset; `make data-publish` and
# `make data-promote` move them (docs/deploy.md, Dictionary releases). The site
# reads the database dict_release names; DICT_DB overrides that, and local
# development pins it to "dictionary".
#
# database_id values are identifiers, not credentials. Remote access needs a
# Cloudflare API token or login for the owning account; local commands never
# touch them. `make data-setup APPLY=1` creates the databases and fills them in.

name = "myordbok"
main = "worker/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist/web"
binding = "ASSETS"
# Unknown app paths get index.html, so deep links like /definition?q=love work.
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Local development reads the local myordbok-dictionary (make data-sample).
[vars]
DICT_DB = "dictionary"

[[d1_databases]]
binding = "APP"
database_name = "myordbok-app"
database_id = "ea406653-37b8-4a9d-bd00-a646660a20ad"
migrations_dir = "assets/db/migrations"

[[d1_databases]]
binding = "DATASET"
database_name = "myordbok-dataset"
database_id = "a989cd47-3618-4af7-9e74-8c597cb610ea"

[[d1_databases]]
binding = "DICTIONARY"
database_name = "myordbok-dictionary"
database_id = "c680ffdb-bb5f-402e-8969-29086c39d835"

# ---------------------------------------------------------------- beta

[env.beta]
name = "myordbok-beta"
workers_dev = false
preview_urls = false
routes = [{ pattern = "beta.myordbok.com", custom_domain = true }]
# NOINDEX keeps beta out of search results (static files get the same header
# from _headers). DICT_DB empty: the database comes from dict_release.
vars = { NOINDEX = "1", ENV_NAME = "beta", DICT_DB = "" }

[[env.beta.d1_databases]]
binding = "APP"
database_name = "myordbok-app"
database_id = "ea406653-37b8-4a9d-bd00-a646660a20ad"
migrations_dir = "assets/db/migrations"

[[env.beta.d1_databases]]
binding = "DATASET"
database_name = "myordbok-dataset"
database_id = "a989cd47-3618-4af7-9e74-8c597cb610ea"

[[env.beta.d1_databases]]
binding = "DICTIONARY"
database_name = "myordbok-dictionary"
database_id = "c680ffdb-bb5f-402e-8969-29086c39d835"

# ---------------------------------------------------------------- production
# Deploying this takes over the myordbok.com DNS record from the current
# Django site. CI only deploys it when the repository variable
# PRODUCTION_ENABLED is "true" (see docs/deploy.md, Cutover).

[env.production]
name = "myordbok-production"
workers_dev = false
preview_urls = false
routes = [{ pattern = "myordbok.com", custom_domain = true }]
vars = { ENV_NAME = "production", DICT_DB = "" }

[[env.production.d1_databases]]
binding = "APP"
database_name = "myordbok-app"
database_id = "ea406653-37b8-4a9d-bd00-a646660a20ad"
migrations_dir = "assets/db/migrations"

[[env.production.d1_databases]]
binding = "DATASET"
database_name = "myordbok-dataset"
database_id = "a989cd47-3618-4af7-9e74-8c597cb610ea"

[[env.production.d1_databases]]
binding = "DICTIONARY"
database_name = "myordbok-dictionary"
database_id = "c680ffdb-bb5f-402e-8969-29086c39d835"
