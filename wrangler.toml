# Cloudflare Worker: serves the built app (dist/web) and the /api routes.
name = "myordbok"
main = "worker/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist/web"
binding = "ASSETS"
# Unknown app paths get index.html, so deep links like /definition?q=love work.
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "myordbok"
# Create with `npx wrangler d1 create myordbok` and paste the id here.
# Local development (--local) works without a real id.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "db/migrations"
