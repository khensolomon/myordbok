# Cloudflare Worker: serves the built app (dist/web) and the /api routes.
#
# Environments (each deploys as its own Worker with its own domain):
#   Worker names: myordbok-local (never deployed), myordbok-beta, myordbok-live
#   (top level)   local development only: `wrangler dev --local`
#   beta          beta.myordbok.com — deployed from the dev branch
#   live          myordbok.com      — deployed from master, switched on at cutover
#
# Bindings and routes are not inherited by environments, so each one
# declares its own. Both sites use the same three D1 databases:
#
#   APP   myordbok-app   what the app writes: members, sign-in, reactions,
#                        comments, workspace edits, and which dictionary
#                        database each site reads (assets/db/migrations).
#                        Migrations must stay backward compatible: beta can
#                        run newer code against the data live reads.
#   BETA  myordbok-beta  every new dictionary build lands here first; beta
#                        reads it, so beta previews the next release
#   LIVE  myordbok-live  the dictionary live readers get
#
# Builds come from the private dataset; `make data-publish` and
# `make data-promote` move them (docs/deploy.md, Dictionary releases). The site
# reads the database dict_release names; DICT_DB overrides that, and local
# development pins it to "live".
#
# database_id values are identifiers, not credentials. Remote access needs a
# Cloudflare API token or login for the owning account; local commands never
# touch them. `make data-setup APPLY=1` creates the databases and fills them in.

# The top level is never deployed. Its name differs from live's, so a
# deploy without --env makes a separate, domain-less Worker instead of
# overwriting myordbok.com with local settings.
name = "myordbok-local"
main = "worker/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist/web"
binding = "ASSETS"
# Unknown app paths get index.html, so deep links like /definition?q=love work.
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Local development reads the local myordbok-live (make data-sample).
# API_GUARD is off here; beta and live turn it on (worker/lib/guard.js).
#
# Sign-in (worker/routes/auth.js): client ids are public and live here; the
# secrets do not. Beta and live: `npx wrangler secret put
# GITHUB_CLIENT_SECRET --env beta` (and GOOGLE_CLIENT_SECRET, and --env
# live). Local: .dev.vars (see .dev.vars.example), which overrides these.
[vars]
DICT_DB = "live"
# The GitHub app is the same as beta's and live's (localhost is one of
# its callbacks); its secret goes in .dev.vars.
GITHUB_CLIENT_ID = "fa6b2eaa13cd8623ac9a"
GOOGLE_CLIENT_ID = "75095486220-gknegpg2ba3jnkjtat8a54i3gpkor15m.apps.googleusercontent.com"

# Rate limits per visitor, counted at each Cloudflare location. Lookups and
# suggestions get the generous one, read/phrase/spelling (many rows each) the
# strict one. namespace_id is unique in the account, so each environment
# counts on its own. Period is 10 or 60 seconds.
[[ratelimits]]
name = "RATE_LOOKUP"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RATE_HEAVY"
namespace_id = "1002"
simple = { limit = 40, period = 60 }

[[d1_databases]]
binding = "APP"
database_name = "myordbok-app"
database_id = "ea406653-37b8-4a9d-bd00-a646660a20ad"
migrations_dir = "assets/db/migrations"

[[d1_databases]]
binding = "BETA"
database_name = "myordbok-beta"
database_id = "00000000-0000-0000-0000-000000000002"

[[d1_databases]]
binding = "LIVE"
database_name = "myordbok-live"
database_id = "00000000-0000-0000-0000-000000000003"

# Every MyOrdbok file, in one private bucket (never public): the offline
# packs under offline/, one folder per dictionary build (scripts/packs.js);
# one bucket serves every site, each reading the folder of its own build.
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "myordbok"

# ---------------------------------------------------------------- beta

[env.beta]
name = "myordbok-beta"
workers_dev = false
preview_urls = false
routes = [{ pattern = "beta.myordbok.com", custom_domain = true }]
# NOINDEX keeps beta out of search results (static files get the same header
# from _headers). DICT_DB empty: the database comes from dict_release.
vars = { NOINDEX = "1", ENV_NAME = "beta", DICT_DB = "", API_GUARD = "1", GITHUB_CLIENT_ID = "fa6b2eaa13cd8623ac9a", GOOGLE_CLIENT_ID = "75095486220-bfoeemmgp0l9tm6roh2rneerbnv6crkr.apps.googleusercontent.com" }

[[env.beta.ratelimits]]
name = "RATE_LOOKUP"
namespace_id = "1101"
simple = { limit = 120, period = 60 }

[[env.beta.ratelimits]]
name = "RATE_HEAVY"
namespace_id = "1102"
simple = { limit = 40, period = 60 }

[[env.beta.d1_databases]]
binding = "APP"
database_name = "myordbok-app"
database_id = "ea406653-37b8-4a9d-bd00-a646660a20ad"
migrations_dir = "assets/db/migrations"

[[env.beta.d1_databases]]
binding = "BETA"
database_name = "myordbok-beta"
database_id = "00000000-0000-0000-0000-000000000002"

[[env.beta.d1_databases]]
binding = "LIVE"
database_name = "myordbok-live"
database_id = "00000000-0000-0000-0000-000000000003"

# Offline packs, one folder per dictionary build (scripts/packs.js); one
# bucket serves every site, each reading the folder of its own build.
[[env.beta.r2_buckets]]
binding = "STORAGE"
bucket_name = "myordbok"

# ---------------------------------------------------------------- live
# Deploying this takes over the myordbok.com DNS record from the current
# Django site. CI only deploys it when the repository variable
# LIVE_ENABLED is "true" (see docs/deploy.md, Cutover).

[env.live]
name = "myordbok-live"
workers_dev = false
preview_urls = false
routes = [{ pattern = "myordbok.com", custom_domain = true }]
vars = { ENV_NAME = "live", DICT_DB = "", API_GUARD = "1", GITHUB_CLIENT_ID = "fa6b2eaa13cd8623ac9a", GOOGLE_CLIENT_ID = "75095486220-bfoeemmgp0l9tm6roh2rneerbnv6crkr.apps.googleusercontent.com" }

[[env.live.ratelimits]]
name = "RATE_LOOKUP"
namespace_id = "1201"
simple = { limit = 120, period = 60 }

[[env.live.ratelimits]]
name = "RATE_HEAVY"
namespace_id = "1202"
simple = { limit = 40, period = 60 }

[[env.live.d1_databases]]
binding = "APP"
database_name = "myordbok-app"
database_id = "ea406653-37b8-4a9d-bd00-a646660a20ad"
migrations_dir = "assets/db/migrations"

[[env.live.d1_databases]]
binding = "BETA"
database_name = "myordbok-beta"
database_id = "00000000-0000-0000-0000-000000000002"

[[env.live.d1_databases]]
binding = "LIVE"
database_name = "myordbok-live"
database_id = "00000000-0000-0000-0000-000000000003"

# Offline packs, one folder per dictionary build (scripts/packs.js); one
# bucket serves every site, each reading the folder of its own build.
[[env.live.r2_buckets]]
binding = "STORAGE"
bucket_name = "myordbok"
