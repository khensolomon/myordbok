# Cloudflare Worker: serves the built app (dist/web) and the /api routes.
#
# Environments (each deploys as its own Worker with its own domain):
#   (top level)   local development only: `wrangler dev --local`
#   beta          beta.myordbok.com — deployed from the dev branch
#   production    myordbok.com      — deployed from master, switched on at cutover
#
# Bindings and routes are not inherited by environments, so each one
# declares its own. Beta and production share one D1 database by choice:
# migrations must stay backward compatible, because beta can run newer code
# against the same data that production reads.
#
# Two kinds of database:
#   DB              app data: members, reactions, comments, studio edits
#                   (assets/db/migrations). Shared by beta and production.
#   DICT_A, DICT_B  the dictionary, built from the private dataset. Two slots,
#                   so a new release is imported and checked in one while the
#                   sites keep reading the other (docs/deploy.md, Data releases).
#                   Which slot a site reads is stored in DB (dict_release);
#                   DICT_SLOT overrides that, and local development uses it.
#
# The database_id is an identifier, not a credential. Remote access needs a
# Cloudflare API token or login for the owning account; local commands never
# touch it.

name = "myordbok"
main = "worker/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist/web"
binding = "ASSETS"
# Unknown app paths get index.html, so deep links like /definition?q=love work.
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "myordbok"
database_id = "526dfd31-5d80-40ce-82aa-8f9c94e27456"
migrations_dir = "assets/db/migrations"

[[d1_databases]]
binding = "DICT_A"
database_name = "myordbok-dict-a"
database_id = "5ad0688d-1af7-4ddd-8190-d7fce7ab57df"

[[d1_databases]]
binding = "DICT_B"
database_name = "myordbok-dict-b"
database_id = "120dc193-8332-487a-896e-92b8376043ef"

# Local development reads the sample dictionary from slot A (make data-sample).
[vars]
DICT_SLOT = "a"

# ---------------------------------------------------------------- beta

[env.beta]
name = "myordbok-beta"
workers_dev = false
preview_urls = false
routes = [{ pattern = "beta.myordbok.com", custom_domain = true }]
# Keeps beta out of search results (static files get the same header from _headers).
# DICT_SLOT empty: the slot comes from dict_release (make data-switch).
vars = { NOINDEX = "1", ENV_NAME = "beta", DICT_SLOT = "" }

[[env.beta.d1_databases]]
binding = "DB"
database_name = "myordbok"
database_id = "526dfd31-5d80-40ce-82aa-8f9c94e27456"
migrations_dir = "assets/db/migrations"

[[env.beta.d1_databases]]
binding = "DICT_A"
database_name = "myordbok-dict-a"
database_id = "5ad0688d-1af7-4ddd-8190-d7fce7ab57df"

[[env.beta.d1_databases]]
binding = "DICT_B"
database_name = "myordbok-dict-b"
database_id = "120dc193-8332-487a-896e-92b8376043ef"

# ---------------------------------------------------------------- production
# Deploying this takes over the myordbok.com DNS record from the current
# Django site. CI only deploys it when the repository variable
# PRODUCTION_ENABLED is "true" (see docs/deploy.md, Cutover).

[env.production]
name = "myordbok-production"
workers_dev = false
preview_urls = false
routes = [{ pattern = "myordbok.com", custom_domain = true }]
vars = { ENV_NAME = "production", DICT_SLOT = "" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "myordbok"
database_id = "526dfd31-5d80-40ce-82aa-8f9c94e27456"
migrations_dir = "assets/db/migrations"

[[env.production.d1_databases]]
binding = "DICT_A"
database_name = "myordbok-dict-a"
database_id = "5ad0688d-1af7-4ddd-8190-d7fce7ab57df"

[[env.production.d1_databases]]
binding = "DICT_B"
database_name = "myordbok-dict-b"
database_id = "120dc193-8332-487a-896e-92b8376043ef"
