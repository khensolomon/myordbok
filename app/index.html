<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>MyOrdbok</title>
	<meta name="description" content="A comprehensive English–Myanmar dictionary that also works offline.">
	<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#0d1116" media="(prefers-color-scheme: dark)">
	<!-- A theme chosen on this device applies before the first paint (app/core/prefs.js). -->
	<!-- So is the interface language: chosen here, else the device's (app/i18n/index.js). -->
	<script>try{var t=localStorage.getItem('mo:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}try{var l=localStorage.getItem('mo:lang');if(l!=='en'&&l!=='my'){l=(navigator.languages||[navigator.language]).filter(function(x){return /^(my|en)\b/i.test(x)})[0]||'en';l=/^my/i.test(l)?'my':'en'}document.documentElement.lang=l}catch(e){}</script>
	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
	<!--styles-->
	<link rel="stylesheet" href="/styles/tokens.css">
	<link rel="stylesheet" href="/styles/base.css">
	<link rel="stylesheet" href="/styles/app.css">
	<!--/styles-->
	<!--importmap: replaced by scripts/build.js with hashed paths-->
	<script type="importmap">
	{
		"imports": {
			"#platform/": "/platform/web/",
			"#shared/": "/shared/"
		}
	}
	</script>
	<!--/importmap-->
</head>
<body>
	<a class="skip" href="#view" data-t>Skip to content</a>
	<header class="site-header">
		<!-- Text on wide screens; icons in a glass capsule on phones. -->
		<nav class="site-nav" aria-label="Main" data-t-label="Main">
			<a href="/" title="Home" data-t-label="Home"><svg class="icon nav-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 11 12 4.6 20 11"/><path d="M6.5 12.5v7h11v-7"/><path d="M10.5 17.5v-2a1.5 1.5 0 0 1 3 0v2"/></svg><span class="nav-label" data-t>Home</span></a>
			<a href="/grammar" title="Grammar" data-t-label="Grammar"><svg class="icon nav-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6.5 4H17a1.5 1.5 0 0 1 1.5 1.5V20H7a2 2 0 0 1-2-2V5.5A1.5 1.5 0 0 1 6.5 4z"/><path d="M5 17.5a2 2 0 0 1 2-2h11.5"/><path d="M9.5 4v5.5l1.75-1.2L13 9.5V4"/></svg><span class="nav-label" data-t>Grammar</span></a>
			<a href="/support" class="nav-support" title="Support" data-t-label="Support"><svg class="icon nav-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 19.5c-4-2.6-8-6-8-10C4 6.9 6 5 8.4 5c1.5 0 2.8.8 3.6 2 .8-1.2 2.1-2 3.6-2C18 5 20 6.9 20 9.5c0 4-4 7.4-8 10z"/></svg><span class="nav-label" data-t>Support</span></a>
		</nav>
		<a class="you" href="/workspace" aria-label="Account: sign in" title="Account">
			<svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5a7 7 0 0 1 14 0"/></svg>
		</a>
		<!-- Phones: shown in place of the menu while the search field has focus (app.css). -->
		<button type="button" class="search-cancel" data-t>Cancel</button>
	</header>

	<!-- Site notices: maintenance and information (app/core/notices.js). -->
	<div class="site-notices" hidden></div>

	<!-- The search bar, shown on the home and definition pages; it stays in view while the page scrolls. -->
	<div class="search-bar">
		<div class="search-bar-inner">
			<a class="bar-logo" href="/" aria-label="MyOrdbok home" data-t-label="MyOrdbok home">
				<img class="logo-full" src="/static/logo.svg" alt="" width="168" height="28">
				<img class="logo-mark" src="/static/icon.svg" alt="" width="34" height="34">
			</a>
			<p class="home-pair">English <span aria-hidden="true">⇄</span> <span lang="my">မြန်မာ</span></p>
			<mo-search id="search"></mo-search>
		</div>
	</div>

	<main id="view" tabindex="-1"></main>

	<footer class="site-footer">
		<span>© MyOrdbok</span>
		<nav aria-label="Legal" data-t-label="Legal">
			<a href="/about" data-t>About</a>
			<a href="/contact" data-t>Contact</a>
			<a href="/privacy" data-t>Privacy</a>
			<a href="/terms" data-t>Terms</a>
		</nav>
	</footer>

	<noscript><p class="page notice">MyOrdbok needs JavaScript to search the dictionary.</p></noscript>
	<script type="module" src="/main.js"></script>
</body>
</html>
