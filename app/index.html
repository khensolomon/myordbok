<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>MyOrdbok</title>
	<meta name="description" content="A comprehensive English–Myanmar dictionary that also works offline.">
	<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#0d1116" media="(prefers-color-scheme: dark)">
	<!-- A theme chosen on this device applies before the first paint (app/core/prefs.js). -->
	<!-- So is the interface language: chosen here, else the device's; while open=false, English but for a reviewer (app/i18n/index.js). -->
	<!-- And the sidebar folded on this device (core/sidebar.js), so it does not open and then fold. -->
	<script>try{if(localStorage.getItem('mo:sidebar')==='folded')document.documentElement.setAttribute('data-folded','')}catch(e){}try{var t=localStorage.getItem('mo:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}try{var open=false,l=open?localStorage.getItem('mo:lang'):localStorage.getItem('mo:lang-review')==='1'?'my':'en';if(l!=='en'&&l!=='my'){l=(navigator.languages||[navigator.language]).filter(function(x){return /^(my|en)\b/i.test(x)})[0]||'en';l=/^my/i.test(l)?'my':'en'}document.documentElement.lang=l}catch(e){}</script>
	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
	<!--styles-->
	<link rel="stylesheet" href="/styles/tokens.css">
	<link rel="stylesheet" href="/styles/base.css">
	<link rel="stylesheet" href="/styles/app.css">
	<!--/styles-->
	<!--importmap: replaced by scripts/build.js with hashed paths-->
	<script type="importmap">
	{
		"imports": {
			"#platform/": "/platform/web/",
			"#shared/": "/shared/"
		}
	}
	</script>
	<!--/importmap-->
</head>
<body>
	<!-- The apps' splash (the tauri build puts it here: scripts/build.js,
	     src-tauri/splash): carried on from the system's own until the first
	     page is drawn (main.js). The website has none. -->
	<!--app-splash-->
	<a class="skip" href="#view" data-t>Skip to content</a>
	<!-- One navigation, laid out by the window's width (app.css): a floating
	     glass tab bar of icons under 1024px; from 1024px to 1179px a sidebar
	     under the page (core/sidebar.js): the tabs with what waits in them,
	     the workspace for members, grammar's topics, the site's pages (no
	     footer beside it), the practice streak at its foot. Dragged sideways, or its button, it folds to its icons;
	     its pages then under ⋯. The More tab carries the member's picture
	     once signed in (main.js). -->
	<nav class="app-nav" aria-label="Main" data-t-label="Main">
		<div class="app-nav-head">
			<button type="button" class="app-fold" aria-label="Hide the sidebar" data-t-label="Hide the sidebar" aria-expanded="true"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M9.5 5v14"/></svg></button>
		</div>
		<a class="app-tab" href="/" data-tab="home" title="Home" data-t-label="Home"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 11 12 4.6 20 11"/><path d="M6.5 12.5v7h11v-7"/><path d="M10.5 17.5v-2a1.5 1.5 0 0 1 3 0v2"/></svg><span class="app-tab-label" data-t>Home</span></a>
		<a class="app-tab" href="/liked" data-tab="liked" title="Liked" data-t-label="Liked"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M7.5 10.5v9H4.8a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z"/><path d="M7.5 10.5 10.9 4.4a1.7 1.7 0 0 1 3.2 1.1L13.4 9h5a2 2 0 0 1 2 2.4l-1.2 6.4a2 2 0 0 1-2 1.7H7.5"/></svg><span class="app-tab-label" data-t>Liked</span></a>
		<a class="app-tab" href="/practice" data-tab="practice" title="Practice" data-t-label="Practice"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="3.5" y="7.5" width="13" height="12.5" rx="2.2"/><path d="M8 4h10.3c1.2 0 2.2 1 2.2 2.2v9.3"/><path d="m7 13.8 2 2 3.6-3.8"/></svg><span class="app-tab-label" data-t>Practice</span><span class="app-count" hidden></span></a>
		<a class="app-tab you" href="/more" data-tab="more" title="More" data-t-label="More"><span class="you-face-slot"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="8.2" cy="12" r="0.6" fill="currentColor"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/><circle cx="15.8" cy="12" r="0.6" fill="currentColor"/></svg></span><span class="app-tab-label" data-t>More</span><span class="app-count app-count-dot" hidden></span></a>
		<a class="app-tab app-workspace" href="/workspace" title="Workspace" data-t-label="Workspace" hidden><svg class="icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="4.5" y="4.5" width="6.5" height="6.5" rx="1.5"/><rect x="13" y="4.5" width="6.5" height="6.5" rx="1.5"/><rect x="4.5" y="13" width="6.5" height="6.5" rx="1.5"/><rect x="13" y="13" width="6.5" height="6.5" rx="1.5"/></svg><span class="app-tab-label" data-t>Workspace</span><span class="app-count" hidden></span></a>
		<div class="app-sections">
			<div class="app-more">
				<p class="app-more-title" data-t>Learn</p>
				<div class="app-grammar">
					<a href="/grammar" class="app-grammar-link" data-t>Grammar</a>
					<button type="button" class="app-disclose" aria-expanded="false" aria-controls="app-topics" aria-label="Grammar's topics" data-t-label="Grammar's topics"><svg class="icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg></button>
				</div>
				<div class="app-topics" id="app-topics" hidden></div>
				<a href="/support" class="app-support" data-store-hidden data-t>Support MyOrdbok</a>
			</div>
			<!-- The footer's pages: beside the sidebar the page has no footer (app.css). -->
			<div class="app-more app-site">
				<p class="app-more-title">MyOrdbok</p>
				<a href="/about" data-t>About</a>
				<a href="/contact" data-t>Contact</a>
				<a href="/privacy" data-t>Privacy</a>
				<a href="/terms" data-t>Terms</a>
			</div>
		</div>
		<div class="app-foot">
			<p class="app-streak" hidden></p>
			<button type="button" class="app-overflow" hidden aria-label="Other pages" data-t-label="Other pages" aria-haspopup="menu" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="6" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></button>
		</div>
	</nav>

	<!-- From 1180px: the classic header, text links and the person button,
	     which opens the More page in a panel (app/core/menu.js). -->
	<header class="site-header">
		<nav class="site-nav" aria-label="Main" data-t-label="Main">
			<a href="/" data-t>Home</a>
			<a href="/liked" data-t>Liked</a>
			<a href="/practice" data-t>Practice</a>
			<a href="/grammar" data-t>Grammar</a>
			<a href="/support" class="nav-support" data-store-hidden><svg class="icon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 19.5c-4-2.6-8-6-8-10C4 6.9 6 5 8.4 5c1.5 0 2.8.8 3.6 2 .8-1.2 2.1-2 3.6-2C18 5 20 6.9 20 9.5c0 4-4 7.4-8 10z"/></svg><span data-t>Support</span></a>
		</nav>
		<a class="you" href="/more" aria-label="More" title="More" data-t-label="More"><span class="you-face-slot"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5a7 7 0 0 1 14 0"/></svg></span><svg class="icon you-caret" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></a>
	</header>

	<!-- Site notices: maintenance and information (app/core/notices.js). -->
	<div class="site-notices" hidden></div>

	<!-- The search bar, shown on the home and definition pages; it stays in view while the page scrolls. -->
	<div class="search-bar">
		<div class="search-bar-inner">
			<a class="bar-logo" href="/" aria-label="MyOrdbok home" data-t-label="MyOrdbok home">
				<img class="logo-full" src="/static/logo.svg" alt="" width="168" height="28">
				<img class="logo-mark" src="/static/icon.svg" alt="" width="34" height="34">
			</a>
			<!-- Under 1024px, home opens with the logo as its large title, at the left, as a phone's own app does (app.css). -->
			<h1 class="home-title"><img src="/static/logo.svg" alt="MyOrdbok" width="168" height="28"></h1>
			<p class="home-pair">English <span aria-hidden="true">⇄</span> <span lang="my">မြန်မာ</span></p>
			<!-- Under 1024px, on a definition: back to the page it was opened from (main.js). -->
			<a class="bar-back" href="/" aria-label="Back" data-t-label="Back"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></a>
			<mo-search id="search"></mo-search>
		</div>
	</div>

	<!-- Under 1024px, a page scrolled past its large title: the title in a small
	     glass bar (app.css), home's logo, another page's name (main.js). -->
	<div class="title-bar" aria-hidden="true"><span><img src="/static/logo.svg" alt="" width="108" height="18"></span></div>

	<!-- Under 1024px (and the sidebar's width, for a page it does not list):
	     Back, on a page the navigation does not lead to (main.js, data-back). -->
	<a class="page-back" href="/more" aria-label="Back" data-t-label="Back"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></a>

	<main id="view" tabindex="-1"></main>

	<footer class="site-footer">
		<span>© MyOrdbok</span>
		<nav aria-label="Legal" data-t-label="Legal">
			<a href="/about" data-t>About</a>
			<a href="/contact" data-t>Contact</a>
			<a href="/privacy" data-t>Privacy</a>
			<a href="/terms" data-t>Terms</a>
		</nav>
	</footer>

	<noscript><p class="page notice">MyOrdbok needs JavaScript to search the dictionary.</p></noscript>
	<script type="module" src="/main.js"></script>
</body>
</html>
